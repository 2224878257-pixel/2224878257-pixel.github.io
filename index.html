<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>老侯场景英语</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17191f;--muted:#6b7280;--line:#e7e9ee;--primary:#4f46e5;--primary-soft:#eef2ff;--danger:#b91c1c;--danger-soft:#fef2f2;--warn:#b45309;--warn-soft:#fff7ed;--success:#047857;--success-soft:#ecfdf5}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding-bottom:84px}
.app{max-width:760px;margin:0 auto;padding:14px}.topbar{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.94);backdrop-filter:blur(12px);padding:10px 0 12px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:24px}.brand .sub{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 8px;font-size:26px}.hero p{margin:0;color:var(--muted);line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stat{background:#f8fafc;border-radius:14px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.primary{width:100%;border:0;border-radius:14px;background:var(--primary);color:#fff;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.ghost{border:1px solid var(--line);border-radius:12px;background:#fff;color:#374151;padding:10px 12px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-title{font-size:17px;font-weight:750;margin:0 0 12px}
.progress-wrap{height:10px;border-radius:999px;background:#eef0f4;overflow:hidden}.progress-bar{height:100%;background:var(--primary);width:0}
.study-toolbar{display:grid;grid-template-columns:1fr 1.15fr 1.15fr 1fr;gap:8px;margin:12px 0}.study-toolbar button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 6px;cursor:pointer;color:#273044}.study-toolbar button.on{background:var(--primary-soft);border-color:#c7d2fe;color:#3730a3;font-weight:700}
.word-card{min-height:59vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 20px;box-shadow:0 12px 30px rgba(0,0,0,.04)}
.word{font-size:44px;font-weight:800;line-height:1.15;word-break:break-word;cursor:pointer;border-radius:12px;padding:5px 10px}.phonetic{font-family:Georgia,"Times New Roman",serif;font-size:18px;color:#667085;margin-top:9px}.translation{font-size:22px;margin-top:13px;color:#374151}.category{font-size:13px;color:var(--muted);margin-top:10px}
.example{margin-top:22px;background:#f8fafc;border-radius:15px;padding:15px;width:100%;line-height:1.65;text-align:left}.example-cn{margin-top:7px;color:var(--muted)}
.card-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.ratebtn{border:0;border-radius:12px;padding:12px 6px;font-weight:700;cursor:pointer;font-size:13px}.unknown{background:var(--danger-soft);color:var(--danger)}.fuzzy{background:var(--warn-soft);color:var(--warn)}.know{background:var(--primary-soft);color:#3730a3}.mastered{background:var(--success-soft);color:var(--success)}
.review-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.review-tabs button{white-space:nowrap}.active-tab{background:#111827!important;color:white!important}
.search{width:100%;border:1px solid #d9dde6;border-radius:12px;padding:12px 14px;font:inherit;background:#fff}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:13px}.chip.active{background:#111827;color:#fff;border-color:#111827}
.word-list{display:flex;flex-direction:column;gap:9px}.word-row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.word-row .en{font-weight:750;font-size:17px;cursor:pointer}.word-row .ipa{font-family:Georgia,serif;font-size:13px;color:#667085;margin-top:2px}.word-row .cn{font-size:14px;color:#4b5563;margin-top:2px}.word-row .meta{font-size:12px;color:var(--muted);margin-top:4px}.smallbtn{border:0;background:#f3f4f6;border-radius:10px;padding:8px 10px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{border:0;background:transparent;padding:7px 2px;color:#6b7280;cursor:pointer;font-size:12px}.bottom-nav button b{display:block;font-size:20px;margin-bottom:2px}.bottom-nav button.active{color:var(--primary)}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:32px 12px}
@media(max-width:520px){.app{padding:10px}.word{font-size:38px}.translation{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.card-actions{grid-template-columns:1fr 1fr}.study-toolbar{grid-template-columns:1fr 1fr}}

/* ===== V6 手机学习页布局优化 ===== */
@media (max-width: 520px) {
  body {
    padding-bottom: 72px;
  }

  .app {
    padding: 8px 10px;
  }

  .topbar {
    padding: 4px 0 6px;
    position: sticky;
  }

  .brand h1 {
    font-size: 22px;
    line-height: 1.15;
  }

  .brand .sub {
    font-size: 12px;
    margin-top: 2px;
    line-height: 1.3;
  }

  .study-toolbar {
    margin: 5px 0 7px;
    gap: 6px;
    grid-template-columns: 1fr 1fr;
  }

  .study-toolbar button {
    padding: 8px 5px;
    min-height: 38px;
    font-size: 13px;
  }

  .word-card {
    min-height: 0;
    height: auto;
    justify-content: flex-start;
    padding: 26px 16px 16px;
    border-radius: 18px;
  }

  .word-card > div:first-child {
    margin-bottom: 8px !important;
    font-size: 12px !important;
  }

  .word {
    font-size: 38px;
    line-height: 1.08;
    padding: 2px 8px;
  }

  .phonetic {
    font-size: 17px;
    margin-top: 6px;
    line-height: 1.2;
  }

  .translation {
    font-size: 21px;
    margin-top: 8px;
    line-height: 1.2;
  }

  .category {
    margin-top: 7px;
    font-size: 12px;
  }

  .example {
    margin-top: 14px;
    padding: 12px 13px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 15px;
  }

  .example-cn {
    margin-top: 5px;
    font-size: 14px;
    line-height: 1.4;
  }

  .card-actions {
    margin-top: 8px;
    gap: 6px;
    grid-template-columns: 1fr 1fr;
  }

  .ratebtn {
    padding: 10px 6px;
    min-height: 42px;
    font-size: 14px;
  }

  .bottom-nav {
    padding-top: 5px;
    padding-bottom: calc(5px + env(safe-area-inset-bottom));
  }

  .bottom-nav button {
    padding: 4px 2px;
    font-size: 11px;
  }

  .bottom-nav button b {
    font-size: 18px;
    margin-bottom: 1px;
  }
}

/* 更矮的手机屏幕再进一步压缩 */
@media (max-width: 520px) and (max-height: 760px) {
  .brand h1 {
    font-size: 20px;
  }

  .brand .sub {
    font-size: 11px;
  }

  .study-toolbar button {
    min-height: 34px;
    padding: 6px 4px;
  }

  .word-card {
    padding-top: 18px;
    padding-bottom: 12px;
  }

  .word {
    font-size: 34px;
  }

  .phonetic {
    font-size: 16px;
  }

  .translation {
    font-size: 19px;
  }

  .example {
    margin-top: 10px;
    padding: 10px 11px;
    font-size: 14px;
  }

  .example-cn {
    font-size: 13px;
  }

  .ratebtn {
    min-height: 38px;
    padding: 8px 5px;
  }
}


/* ===== V7 英语动画页 ===== */
.cartoon-intro{background:linear-gradient(180deg,#fff,#f8faff);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.cartoon-intro h2{margin:0 0 8px;font-size:24px}.cartoon-intro p{margin:0;color:var(--muted);line-height:1.65}
.cartoon-tip{margin-top:12px;padding:12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:13px;line-height:1.6}
.cartoon-filters{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.cartoon-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cartoon-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cartoon-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cartoon-name{font-size:19px;font-weight:800;line-height:1.25}.level-badge{font-size:12px;font-weight:700;border-radius:999px;background:#ecfdf5;color:#047857;padding:5px 8px;white-space:nowrap}
.cartoon-type{font-size:12px;color:var(--muted)}.cartoon-focus{font-size:14px;font-weight:700}.cartoon-copy{font-size:13px;color:#4b5563;line-height:1.6}
.word-tags{display:flex;gap:6px;flex-wrap:wrap}.word-tag{font-size:12px;background:#f3f4f6;border-radius:999px;padding:5px 8px;color:#374151}
.cartoon-actions{display:flex;gap:8px;margin-top:auto}.cartoon-actions button{flex:1;border:0;border-radius:11px;padding:10px 8px;font-weight:700;cursor:pointer}
.watch-btn{background:#111827;color:#fff}.words-btn{background:#eef2ff;color:#3730a3}
@media(max-width:520px){.cartoon-grid{grid-template-columns:1fr}.cartoon-intro{padding:15px}.cartoon-intro h2{font-size:21px}.cartoon-card{padding:14px}}

</style>
</head><body>
<div class="app">
<div class="topbar"><div class="brand"><div><h1>老侯场景英语</h1><div class="sub">1078 词 · V7 动画学习版</div></div></div></div>

<main id="view-home">
<section class="panel hero"><h2>今天继续学一点</h2><p>“今日已学”按今天完成评分的不同单词数统计。</p>
<div class="stats"><div class="stat"><b id="statToday">0</b><span>今日已学</span></div><div class="stat"><b id="statReview">0</b><span>今日待复习</span></div><div class="stat"><b id="statMastered">0</b><span>已掌握</span></div><div class="stat"><b id="statStreak">0</b><span>连续天数</span></div></div>
<button class="primary" onclick="startToday()">开始今天学习</button></section>
<section class="panel"><div class="section-title">今日计划</div><div id="todayPlanText" style="color:var(--muted);font-size:13px;margin-bottom:8px"></div><div class="progress-wrap"><div class="progress-bar" id="todayProgressBar"></div></div></section>
<section class="panel"><div class="section-title">按场景学习</div><div class="grid2" id="categoryHome"></div></section>
</main>

<main id="view-study" class="hidden">
<div class="study-toolbar"><button onclick="prevCard()">← 上一个</button><button id="autoBtn" onclick="toggleAuto()">🔊 自动朗读</button><button id="continuousBtn" onclick="toggleContinuous()">▶ 连续朗读</button><button onclick="nextCard()">下一个 →</button></div>
<div id="studyCard"></div></main>

<main id="view-review" class="hidden">
<section class="panel">
<div class="section-title">复习</div>
<div class="review-tabs">
<button id="tab-due" class="ghost active-tab" onclick="setReviewMode('due')">今日待复习</button>
<button id="tab-weak" class="ghost" onclick="setReviewMode('weak')">错词巩固</button>
<button id="tab-learned" class="ghost" onclick="setReviewMode('learned')">已学词回顾</button>
</div>
<button class="primary" onclick="startReviewMode()">开始这一组复习</button>
</section>
<section class="panel"><div id="reviewCount" class="section-title"></div><div id="reviewList" class="word-list"></div></section>
</main>

<main id="view-vocab" class="hidden"><section class="panel"><input id="searchBox" class="search" placeholder="搜索英文、中文、分类…" oninput="renderVocab()"><div class="filters" id="filterChips"></div><div id="vocabCount" style="color:var(--muted);font-size:13px;margin:6px 0 12px"></div><div id="vocabList" class="word-list"></div></section></main>

<main id="view-animation" class="hidden">
  <section class="cartoon-intro">
    <h2>🎬 英语动画</h2>
    <p>先从听得懂一点的动画开始，不追求每句都懂。重点是让耳朵反复接触最常用的词和短句。</p>
    <div class="cartoon-tip">推荐学习法：第 1 遍看画面理解剧情 → 第 2 遍注意重复词句 → 只挑 3–5 个词或 1–3 句话跟读。</div>
  </section>
  <div class="cartoon-filters" id="cartoonFilters"></div>
  <section class="cartoon-grid" id="cartoonGrid"></section>
</main>

<main id="view-stats" class="hidden"><section class="panel"><div class="section-title">学习统计</div><div class="stats"><div class="stat"><b id="sLearned">0</b><span>已学</span></div><div class="stat"><b id="sMastered">0</b><span>已掌握</span></div><div class="stat"><b id="sUnknown">0</b><span>不认识</span></div><div class="stat"><b id="sAccuracy">0%</b><span>认识率</span></div></div></section></main>
</div>
<nav class="bottom-nav">
  <button id="nav-home" class="active" onclick="showView('home')"><b>⌂</b>学习</button>
  <button id="nav-review" onclick="showView('review')"><b>↻</b>复习</button>
  <button id="nav-vocab" onclick="showView('vocab')"><b>☰</b>词库</button>
  <button id="nav-animation" onclick="showView('animation')"><b>▶</b>动画</button>
  <button id="nav-stats" onclick="showView('stats')"><b>▥</b>统计</button>
</nav>

<script>

const SK='laohou_progress_v5', DK='laohou_daily_v5';
let state={}, daily={}, currentQueue=[], currentIndex=0, activeFilter='全部', reviewMode='due';
let voices=[], autoSpeak=false, continuous=false, sequenceToken=0;
const settings={dailyNew:20,rateEn:.85,rateZh:1};

function migrateOld(){
  const oldStateKeys=['laohou_progress_v4','laohou_vocab_progress_v3','laohou_vocab_progress_v2'];
  const oldDailyKeys=['laohou_daily_v4','laohou_vocab_daily_v3','laohou_vocab_daily_v2'];
  let ns=JSON.parse(localStorage.getItem(SK)||'{}');
  if(!Object.keys(ns).length){
    for(const k of oldStateKeys){try{let x=JSON.parse(localStorage.getItem(k)||'{}');if(Object.keys(x).length){ns=x;break}}catch(e){}}
  }
  let nd=JSON.parse(localStorage.getItem(DK)||'{}');
  if(!Object.keys(nd).length){
    for(const k of oldDailyKeys){try{let x=JSON.parse(localStorage.getItem(k)||'{}');if(Object.keys(x).length){nd=x;break}}catch(e){}}
  }
  state=ns;daily=nd;
  localStorage.setItem(SK,JSON.stringify(state));localStorage.setItem(DK,JSON.stringify(daily));
}
migrateOld();

function localDateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function day(){const k=localDateKey();if(!daily[k])daily[k]={seen:[],rated:[],count:0};return daily[k]}
function save(){localStorage.setItem(SK,JSON.stringify(state));localStorage.setItem(DK,JSON.stringify(daily))}
function sw(id){id=String(id);if(!state[id])state[id]={status:'new',reviewAt:0,correct:0,wrong:0,last:0};return state[id]}
function markToday(id,status){
  const d=day(),sid=Number(id);
  if(!d.seen.includes(sid))d.seen.push(sid);
  d.rated=d.rated||[];
  d.rated.push({id:sid,status,ts:Date.now()});
  d.count=d.seen.length; // unique words, not button taps
}

function due(){const t=Date.now();return vocab.filter(v=>{let s=state[String(v.id)];return s&&s.reviewAt&&s.reviewAt<=t&&s.status!=='mastered'})}
function weak(){return vocab.filter(v=>{let s=state[String(v.id)];return s&&(s.status==='unknown'||s.status==='fuzzy')})}
function learned(){return vocab.filter(v=>{let s=state[String(v.id)];return s&&s.status&&s.status!=='new'}).sort((a,b)=>(state[String(b.id)].last||0)-(state[String(a.id)].last||0))}
function fresh(){const seen=new Set(day().seen);return vocab.filter(v=>(!state[String(v.id)]||state[String(v.id)].status==='new')&&!seen.has(Number(v.id))).slice(0,settings.dailyNew)}

function rateWord(status){
  const r=currentQueue[currentIndex];if(!r)return;
  const s=sw(r.id),t=Date.now();s.status=status;s.last=t;
  if(status==='unknown'){s.wrong++;s.reviewAt=t+6*60*60*1000}
  if(status==='fuzzy'){s.wrong++;s.reviewAt=t+24*60*60*1000}
  if(status==='know'){s.correct++;s.reviewAt=t+3*24*60*60*1000}
  if(status==='mastered'){s.correct++;s.reviewAt=t+14*24*60*60*1000}
  markToday(r.id,status);save();
  if(currentIndex<currentQueue.length-1){currentIndex++;renderStudyCard()}else{showView('home')}
}

function startToday(){currentQueue=[...due().slice(0,30),...fresh()];if(!currentQueue.length)return alert('今天计划已经完成');currentIndex=0;showView('study');renderStudyCard()}
function setReviewMode(m){reviewMode=m;['due','weak','learned'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active-tab',x===m));renderReview()}
function reviewItems(){if(reviewMode==='due')return due();if(reviewMode==='weak')return weak();return learned()}
function startReviewMode(){currentQueue=reviewItems().slice(0,50);if(!currentQueue.length)return alert('这一组目前没有单词');currentIndex=0;showView('study');renderStudyCard()}
function renderReview(){const list=reviewItems();reviewCount.textContent=`${list.length} 个词`;reviewList.innerHTML=list.length?'':'<div class="empty">这一组暂时没有单词</div>';list.slice(0,120).forEach(r=>reviewList.appendChild(row(r)))}

function loadVoices(){voices=speechSynthesis.getVoices()}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function voice(lang){return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))}
function utter(text,lang,rate,done){let u=new SpeechSynthesisUtterance(text);u.lang=lang==='zh'?'zh-CN':'en-US';u.rate=rate;let v=voice(lang);if(v)u.voice=v;u.onend=()=>done&&done();speechSynthesis.speak(u)}
function stopSpeech(){sequenceToken++;speechSynthesis.cancel()}
function speakWordOnly(){let r=currentQueue[currentIndex];if(!r)return;stopSpeech();utter(r['英文'],'en',settings.rateEn)}
function speakPair(r){stopSpeech();utter(r['英文'],'en',settings.rateEn,()=>setTimeout(()=>utter(r['中文'],'zh',settings.rateZh),160))}
function speakFull(done){let r=currentQueue[currentIndex];if(!r)return;stopSpeech();let token=sequenceToken;const ok=()=>token===sequenceToken;utter(r['英文'],'en',settings.rateEn,()=>{if(!ok())return;setTimeout(()=>utter(r['中文'],'zh',settings.rateZh,()=>{if(!ok())return;setTimeout(()=>utter(r['英文例句'],'en',settings.rateEn,()=>{if(!ok())return;setTimeout(()=>utter(r['中文例句'],'zh',settings.rateZh,()=>{if(ok()&&done)done()}),160)}),200)}),160)})}
function toggleAuto(){autoSpeak=!autoSpeak;autoBtn.classList.toggle('on',autoSpeak);autoBtn.textContent=autoSpeak?'🔊 自动朗读：开':'🔊 自动朗读';if(autoSpeak&&!continuous)speakFull()}
function toggleContinuous(){continuous=!continuous;continuousBtn.classList.toggle('on',continuous);continuousBtn.textContent=continuous?'■ 停止连续':'▶ 连续朗读';if(continuous)runContinuous();else stopSpeech()}
function runContinuous(){if(!continuous)return;renderStudyCard(false);speakFull(()=>{if(!continuous)return;if(currentIndex<currentQueue.length-1){currentIndex++;setTimeout(runContinuous,400)}else{continuous=false;continuousBtn.classList.remove('on');continuousBtn.textContent='▶ 连续朗读'}})}
function prevCard(){stopSpeech();if(currentIndex>0){currentIndex--;renderStudyCard()}}
function nextCard(){stopSpeech();if(currentIndex<currentQueue.length-1){currentIndex++;renderStudyCard()}}

function renderStudyCard(canAuto=true){
  const r=currentQueue[currentIndex];if(!r)return;
  studyCard.innerHTML=`<div class="word-card"><div style="font-size:13px;color:var(--muted);margin-bottom:12px">${currentIndex+1} / ${currentQueue.length}</div><div class="word" onclick="speakWordOnly()">${r['英文']}</div><div class="phonetic">${r['音标']||''}</div><div class="translation">${r['中文']}</div><div class="category">${r['分类']||''}${r['使用场景']?' · '+r['使用场景']:''}</div><div class="example"><div>${r['英文例句']}</div><div class="example-cn">${r['中文例句']}</div></div></div><div class="card-actions"><button class="ratebtn unknown" onclick="rateWord('unknown')">不认识</button><button class="ratebtn fuzzy" onclick="rateWord('fuzzy')">模糊</button><button class="ratebtn know" onclick="rateWord('know')">认识</button><button class="ratebtn mastered" onclick="rateWord('mastered')">已掌握</button></div>`;
  if(canAuto&&autoSpeak&&!continuous)speakFull();
}

function showView(n){stopSpeech();continuous=false;['home','study','review','vocab','animation','stats'].forEach(v=>{document.getElementById('view-'+v).classList.toggle('hidden',v!==n);let b=document.getElementById('nav-'+v);if(b)b.classList.toggle('active',v===n)});if(n==='home')
let cartoonLevel='全部';
function renderCartoonFilters(){
  const levels=['全部','Pre-A1','A1','A1-A2']; cartoonFilters.innerHTML='';
  levels.forEach(level=>{const b=document.createElement('button');b.className='chip'+(cartoonLevel===level?' active':'');b.textContent=level;b.onclick=()=>{cartoonLevel=level;renderCartoons()};cartoonFilters.appendChild(b);});
}
function renderCartoons(){
  renderCartoonFilters();
  const list=cartoonResources.filter(x=>cartoonLevel==='全部'||x.level===cartoonLevel);
  cartoonGrid.innerHTML='';
  list.forEach(item=>{
    const card=document.createElement('article'); card.className='cartoon-card';
    card.innerHTML=`<div class="cartoon-top"><div><div class="cartoon-name">${item.name}</div><div class="cartoon-type">${item.type} · ${item.source}</div></div><span class="level-badge">${item.level}</span></div>
    <div class="cartoon-focus">适合学：${item.focus}</div><div class="cartoon-copy">${item.why}</div><div class="cartoon-copy"><b>怎么学：</b>${item.method}</div>
    <div class="word-tags">${item.words.map(w=>`<span class="word-tag">${w}</span>`).join('')}</div>
    <div class="cartoon-actions"><button class="watch-btn">▶ 官方观看</button><button class="words-btn">查重点词</button></div>`;
    card.querySelector('.watch-btn').onclick=()=>window.open(item.url,'_blank','noopener');
    card.querySelector('.words-btn').onclick=()=>{activeFilter='全部';showView('vocab');searchBox.value=item.words[0]||'';renderVocab();};
    cartoonGrid.appendChild(card);
  });
}

renderHome();if(n==='review')renderReview();if(n==='vocab')renderVocab();if(n==='animation')renderCartoons();if(n==='stats')renderStats();window.scrollTo(0,0)}
function renderHome(){
  const d=day();statToday.textContent=d.seen.length;statReview.textContent=due().length;statMastered.textContent=Object.values(state).filter(s=>s.status==='mastered').length;statStreak.textContent=streak();
  const target=settings.dailyNew+Math.min(due().length,30),pct=Math.min(100,Math.round(d.seen.length/Math.max(1,target)*100));
  todayPlanText.textContent=`今日已完成 ${d.seen.length} 个 · 新词目标 ${settings.dailyNew} · 到期复习 ${due().length} 个`;todayProgressBar.style.width=pct+'%';renderCats()
}
function streak(){let n=0,d=new Date();for(let i=0;i<365;i++){let k=localDateKey(d);if(daily[k]&&daily[k].seen&&daily[k].seen.length){n++;d.setDate(d.getDate()-1)}else if(i===0)d.setDate(d.getDate()-1);else break}return n}
function groups(){let m={};vocab.forEach(v=>(m[v['分类']]||(m[v['分类']]=[])).push(v));return m}
function renderCats(){categoryHome.innerHTML='';Object.entries(groups()).slice(0,8).forEach(([c,a])=>{let b=document.createElement('button');b.className='ghost';let n=a.filter(v=>state[String(v.id)]&&state[String(v.id)].status!=='new').length;b.innerHTML=`<b>${c}</b><div style="font-size:12px;color:#6b7280;margin-top:5px">${n} / ${a.length} 已学</div>`;b.onclick=()=>{activeFilter=c;showView('vocab')};categoryHome.appendChild(b)})}
function row(r){let s=state[String(r.id)]||{status:'new'},d=document.createElement('div');d.className='word-row';d.innerHTML=`<div><div class="en">${r['英文']}</div><div class="ipa">${r['音标']||''}</div><div class="cn">${r['中文']}</div><div class="meta">${r['分类']} · ${s.status||'new'}</div></div><button class="smallbtn">🔊</button>`;d.querySelector('.en').onclick=()=>speakPair(r);d.querySelector('button').onclick=()=>speakPair(r);return d}
function renderVocab(){let cats=['全部',...Object.keys(groups())];filterChips.innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='chip'+(activeFilter===c?' active':'');b.textContent=c;b.onclick=()=>{activeFilter=c;renderVocab()};filterChips.appendChild(b)});let q=(searchBox.value||'').toLowerCase(),list=vocab.filter(r=>(activeFilter==='全部'||r['分类']===activeFilter)&&(!q||[r['英文'],r['中文'],r['分类']].some(x=>String(x).toLowerCase().includes(q))));vocabCount.textContent=list.length+' 个词';vocabList.innerHTML='';list.slice(0,300).forEach(r=>vocabList.appendChild(row(r)))}
function renderStats(){let a=Object.values(state),c=a.reduce((n,s)=>n+(s.correct||0),0),w=a.reduce((n,s)=>n+(s.wrong||0),0);sLearned.textContent=a.filter(s=>s.status&&s.status!=='new').length;sMastered.textContent=a.filter(s=>s.status==='mastered').length;sUnknown.textContent=a.filter(s=>s.status==='unknown').length;sAccuracy.textContent=(c+w)?Math.round(c/(c+w)*100)+'%':'0%'}
renderHome();
</script></body></html>
