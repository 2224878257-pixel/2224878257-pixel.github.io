<h1>企业获客自查清单</h1>
<p class="checklist-intro">逐项勾选，快速确认获客链路里哪些基础工作已经完成、哪些环节还需要进一步检查。清单用于快速排查获客链路中的可能问题，不等同于完整诊断。</p>
<div class="checklist-grid">
<section class="checklist-group"><h2>1. 市场与产品</h2><label><input type="checkbox">所在市场是否存在明确且持续的客户需求？</label><label><input type="checkbox">产品核心价值是否能用一句话讲清楚？</label><label><input type="checkbox">报价、交付能力与目标市场是否匹配？</label></section>
<section class="checklist-group"><h2>2. 客户定位</h2><label><input type="checkbox">是否明确最希望获得哪一类客户？</label><label><input type="checkbox">是否了解客户的购买动机、顾虑和决策周期？</label><label><input type="checkbox">投放人群与实际成交客户是否一致？</label></section>
<section class="checklist-group"><h2>3. 广告渠道</h2><label><input type="checkbox">所选平台是否覆盖目标客户？</label><label><input type="checkbox">是否区分搜索、信息流和内容渠道的意图差异？</label><label><input type="checkbox">是否为不同渠道设置独立数据口径？</label></section>
<section class="checklist-group"><h2>4. 素材</h2><label><input type="checkbox">素材是否清楚表达服务对象和核心价值？</label><label><input type="checkbox">素材承诺是否与实际产品和服务一致？</label><label><input type="checkbox">是否持续测试不同卖点、形式和人群？</label></section>
<section class="checklist-group"><h2>5. 落地页 / 表单</h2><label><input type="checkbox">页面信息是否与广告承诺保持一致？</label><label><input type="checkbox">表单字段是否必要且容易填写？</label><label><input type="checkbox">移动端加载和提交是否正常？</label></section>
<section class="checklist-group"><h2>6. 线索有效率</h2><label><input type="checkbox">是否有清晰、统一的有效线索标准？</label><label><input type="checkbox">是否记录无效原因并按渠道、素材拆分？</label><label><input type="checkbox">是否定期核对广告后台与销售记录？</label></section>
<section class="checklist-group"><h2>7. 响应速度</h2><label><input type="checkbox">是否记录线索进入到首次联系的时间？</label><label><input type="checkbox">非工作时间是否有明确的承接方式？</label><label><input type="checkbox">是否对未接通线索安排后续跟进？</label></section>
<section class="checklist-group"><h2>8. 邀约与到店</h2><label><input type="checkbox">是否有统一但不过度机械的邀约流程？</label><label><input type="checkbox">是否提供足够的案例、地址和信任材料？</label><label><input type="checkbox">是否记录未预约、未到店的具体原因？</label></section>
<section class="checklist-group"><h2>9. 销售转化</h2><label><input type="checkbox">销售是否能准确理解客户需求并匹配方案？</label><label><input type="checkbox">报价、案例和异议处理材料是否齐全？</label><label><input type="checkbox">是否记录未成交原因与后续跟进节点？</label></section>
<section class="checklist-group"><h2>10. 数据复盘</h2><label><input type="checkbox">是否每周复盘线索、有效、到店和成交？</label><label><input type="checkbox">是否能区分流量、承接、销售和产品问题？</label><label><input type="checkbox">每次复盘是否形成下一步测试动作？</label></section>
</div>
