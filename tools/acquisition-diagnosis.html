ld"><label for="revenue">成交金额</label><input id="revenue" type="number" min="0" value="50000"></div></div><div id="error" class="error"></div><div class="result-grid"><div class="result"><span>单条线索成本</span><b id="cpl">—</b></div><div class="result"><span>有效线索成本</span><b id="cpValid">—</b></div><div class="result"><span>有效线索率</span><b id="validRate">—</b></div><div class="result"><span>到店转化率</span><b id="visitRate">—</b></div><div class="result"><span>成交率</span><b id="dealRate">—</b></div><div class="result"><span>单客获客成本</span><b id="cac">—</b></div><div class="result"><span>广告 ROAS</span><b id="roas">—</b></div></div><div class="notice"><strong>诊断建议：</strong><span id="advice"></span><br><br>说明：这些指标只能帮助定位可能的薄弱环节，不能单独判断业务问题根因。还需要结合行业、利润、产品、销售过程和数据口径进一步判断。</div></section></div></main><script src="/assets/calculators.js"></script><script src="/assets/tools.js"></script><footer class="footer"><div class="wrap footer-inner"><div>© 2026 老侯聊获客</div><div>聊获客、聊投放、聊增长。</div></div></footer><script src="/assets/config.js"></script><script src="/assets/site.js"></script></body></html>
