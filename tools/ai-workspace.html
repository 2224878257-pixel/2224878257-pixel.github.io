<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --bg:#fff;--text:#161616;--muted:#6f6f6f;--soft:#9a9a9a;
  --line:#ececec;--blue:#2563eb;--max:780px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  line-height:1.72;
}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.wrap{width:min(var(--max),calc(100% - 36px));margin:0 auto}

/* 顶部 */
.site-header{border-bottom:1px solid var(--line);background:#fff}
.header-inner{height:72px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px}
.site-name{font-size:26px;font-weight:760;letter-spacing:-.04em}
.main-nav{display:flex;justify-content:center;gap:26px}
.main-nav a{font-size:13px;color:var(--muted)}
.main-nav a:hover,.main-nav a.active{color:var(--text);font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-right>a:not(.avatar-link){font-size:12px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}

/* 首页 */
.home-intro{padding:56px 0 28px}
.home-intro .hello{font-size:13px;color:var(--muted);margin-bottom:10px}
.home-intro h1{font-size:31px;line-height:1.42;letter-spacing:-.035em;margin:0;font-weight:700}
.home-intro p{margin:14px 0 0;color:var(--muted);font-size:15px;max-width:660px}

.social-area{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.social-label{font-size:12px;color:var(--soft);margin-bottom:12px}
.social-logos{display:flex;flex-wrap:wrap;gap:12px}
.social-logo-link{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 13px;border:1px solid var(--line);border-radius:999px;
  background:#fff;font-size:13px;transition:.18s ease
}
.social-logo-link:hover{transform:translateY(-1px);background:#fafafa;border-color:#d8d8d8}
.brand-icon{width:22px;height:22px;display:block;flex:0 0 22px}

.post-stream{padding:4px 0 22px}
.post{display:grid;grid-template-columns:112px 1fr;gap:30px;padding:30px 0;border-bottom:1px solid var(--line)}
.post-meta{font-size:12px;color:var(--soft);line-height:1.7}
.post-meta .cat{display:block;color:var(--blue);margin-top:5px}
.post-body h2{font-size:24px;line-height:1.42;letter-spacing:-.02em;margin:0 0 8px;font-weight:650}
.post-body p{font-size:14px;color:var(--muted);margin:0}
.read{display:inline-block;margin-top:10px;font-size:13px;color:var(--blue)}

.home-extra{padding:30px 0 8px}
.home-extra h3{font-size:16px;margin:0 0 12px}
.mini-links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini-link{border-top:1px solid var(--line);padding-top:12px}
.mini-link small{color:var(--soft);font-size:11px}
.mini-link b{display:block;font-size:14px;margin-top:3px}
.mini-link span{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* 子页面统一样式 */
.page-head{padding:46px 0 22px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:32px;margin:0 0 8px;letter-spacing:-.035em}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.list{padding-bottom:26px}
.list-item{padding:24px 0;border-bottom:1px solid var(--line)}
.list-item .meta{font-size:12px;color:var(--soft)}
.list-item h2{font-size:22px;line-height:1.4;margin:5px 0 6px}
.list-item p{font-size:14px;color:var(--muted);margin:0}
.list-item .read{margin-top:8px}

.article{max-width:700px;margin:0 auto;padding:48px 0 70px}
.article .meta{font-size:12px;color:var(--soft)}
.article h1{font-size:38px;line-height:1.3;letter-spacing:-.04em;margin:8px 0 20px}
.article .lead{font-size:17px;color:#4c4c4c}
.article h2{font-size:22px;margin-top:34px}
.article p,.article li{font-size:16px;color:#4f4f4f}
.article blockquote{margin:26px 0;padding-left:16px;border-left:3px solid #111;color:#3f3f3f}
.back{display:inline-block;margin-top:40px;color:var(--blue);font-size:13px}

/* 关于 */
.about-grid{display:grid;grid-template-columns:1fr 220px;gap:38px;padding:34px 0 52px}
.about-main p{color:#4f4f4f}
.profile-card{border-left:1px solid var(--line);padding-left:24px}
.profile-card img.avatar-lg{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:12px}
.profile-card h3{margin:0 0 4px;font-size:18px}
.profile-card p{margin:5px 0;font-size:13px;color:var(--muted)}
.socials-section{padding:30px 0 56px;border-top:1px solid var(--line)}
.socials-section h2{font-size:22px;margin:0 0 8px}
.socials-section>p{font-size:13px;color:var(--muted);margin:0 0 18px}
.social-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.social-card{border:1px solid var(--line);border-radius:12px;padding:16px}
.social-card h3{font-size:15px;margin:0 0 5px}
.social-card p{font-size:12px;color:var(--muted);margin:0}
.social-card .social-open{display:inline-block;margin-top:10px;font-size:12px;color:var(--blue)}
.qr-row{display:flex;align-items:center;gap:14px}
.qr{width:96px;height:96px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:#fff}

.footer{border-top:1px solid var(--line);padding:24px 0 34px;color:var(--soft);font-size:11px}
.footer-inner{display:flex;justify-content:space-between;gap:20px}

@media(max-width:680px){
  .header-inner{grid-template-columns:auto 1fr}.main-nav{display:none}.header-right{justify-content:flex-end}
  .header-right>a:not(.avatar-link){display:none}
  .post{grid-template-columns:1fr;gap:7px;padding:24px 0}
  .mini-links{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr}.profile-card{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:22px}
  .social-grid{grid-template-columns:1fr}
  .footer-inner{flex-direction:column}
}
