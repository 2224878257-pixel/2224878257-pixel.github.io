<style>
:root{
  --bg:#f7f8fb;--card:#fff;--soft:#fbfcfe;--text:#101828;--text2:#344054;
  --muted:#667085;--line:#e7ebf2;--blue:#2563eb;--purple:#7c3aed;--green:#16a34a;
  --shadow:0 16px 38px rgba(15,23,42,.06);--hover:0 20px 44px rgba(15,23,42,.10);
  --r-xl:32px;--r-lg:22px;--r-md:16px;--max:1180px
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
color:var(--text);line-height:1.72;background:linear-gradient(180deg,#fbfcfe 0%,#f7f9fc 48%,#f4f7fb 100%)}
a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 40px));margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 18px rgba(15,23,42,.035)}
.nav{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(231,235,242,.88);background:rgba(248,250,252,.88);backdrop-filter:blur(16px)}
.nav-inner{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:15px}
.nav-links{display:flex;gap:24px;color:var(--muted);font-size:14px}.nav-links a:hover{color:var(--text)}
.section{padding:38px 0}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-head h2{margin:0;font-size:29px;line-height:1.2;letter-spacing:-.035em}.section-head p{margin:0;color:var(--muted);font-size:14px}
.hero{padding:36px 0 20px}.hero-shell{position:relative;overflow:hidden;border:1px solid #e4e9f1;border-radius:var(--r-xl);padding:58px 50px;

.hero-desc{max-width:680px;margin:20px 0 0;color:var(--text2);font-size:17px;line-height:1.9}

.btn-dark{background:#101828;color:white}.btn-light{border:1px solid #d9e1ec;background:white}
.hero-profile{padding:24px;border:1px solid #e5eaf2;border-radius:24px;background:linear-gradient(180deg,#f8fbff,#f4f7fc)}

.hero-profile-name{font-size:19px;font-weight:850}.hero-profile-role{margin-top:4px;color:var(--muted);font-size:13px}
.signal-title{margin-bottom:12px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.signal{padding:16px 14px;border:1px solid #e6ebf2;border-radius:15px;background:white}
.signal b{display:block;font-size:27px;line-height:1.1}.signal span{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.hero-mini{display:grid;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid #e5eaf2;color:#475467;font-size:13px}
.hero-mini-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.hero-social{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dce3ed;background:#fff;font-size:12px;font-weight:800}
.hero-social.wechat{color:#16a34a}.hero-social.xhs{color:#ef4444}.hero-social.douyin{color:#111827}.hero-social.x{color:#000}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.item-card{padding:22px;transition:.2s}.item-card:hover{transform:translateY(-4px);box-shadow:var(--hover)}
.item-kicker{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.08em}.item-card h3{margin:8px 0 8px;font-size:20px}
.item-card p{margin:0;color:var(--muted);font-size:13px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{padding:6px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px}.arrow-link{display:inline-block;margin-top:16px;color:var(--blue);font-weight:750;font-size:13px}
.social-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.social-card{padding:22px}.social-top{display:flex;justify-content:space-between;align-items:center}
.social-name{font-size:19px;font-weight:850}.social-card p{color:var(--muted);font-size:13px}.qr-card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.qr-box{width:118px;height:118px;padding:6px;border:1px solid #e2e7ef;border-radius:14px;background:#fff}.qr-box img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.footer{padding:34px 0 56px;text-align:center;color:var(--muted);font-size:13px}
.page-hero{padding:54px 0 18px}.page-hero h1{font-size:48px;margin:0 0 10px;letter-spacing:-.05em}.page-hero p{color:var(--muted);max-width:720px}
.detail{max-width:860px;margin:0 auto}.detail .card{padding:32px}.detail h2{margin-top:28px}.detail p,.detail li{color:#475467}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}.grid-3,.social-grid{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.nav-inner{height:auto;min-height:66px;flex-wrap:wrap;padding:12px 0 0}.nav-links{display:flex;width:100%;gap:18px;padding:2px 0 10px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.hero-shell{padding:42px 28px}.hero-title{font-size:48px}.hero-role{font-size:23px}}
